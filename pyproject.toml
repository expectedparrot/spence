[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spence"
version = "0.1.0"
description = "Applicant tracking and human candidate reviews with EDSL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["edsl @ git+https://github.com/expectedparrot/edsl.git@main"]

[project.urls]
Repository = "https://github.com/expectedparrot/spence"
Issues = "https://github.com/expectedparrot/spence/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
spence = "spence.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/spence"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
